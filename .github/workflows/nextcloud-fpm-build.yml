# Builds the ContainerForge-compatible image from an official linux/amd64 base.
# Rejects PHP runtimes missing the October 21, 2026 security fixes before publish.
# Nextcloud 35.0.2 also generates catalog 31.0.26 from the current 31.0.25 chart.
# Does not push to the catalog repository or contact TrueNAS.

name: Build Nextcloud FPM

on:
  workflow_dispatch:
    inputs:
      nextcloud_version:
        description: Nextcloud server version to build
        type: choice
        required: true
        default: '35.0.2'
        options:
          - '32.0.15'
          - '33.0.9'
          - '34.0.4'
          - '35.0.2'

permissions:
  contents: read

concurrency:
  group: nextcloud-fpm-${{ inputs.nextcloud_version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the catalog-file generator
        if: inputs.nextcloud_version == '35.0.2'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: workflow-source
          sparse-checkout: .github/scripts/prepare-nextcloud-catalog.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check out the current catalog baseline
        if: inputs.nextcloud_version == '35.0.2'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: kqmaverick/catalog
          ref: main
          path: catalog-source
          sparse-checkout: |
            /catalog.json
            /premium/nextcloud/31.0.25/
            /premium/nextcloud/31.0.26/
            /premium/nextcloud/app_versions.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check out pinned ContainerForge source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: trueforge-org/containerforge
          ref: 91adeaab0fa0b607112c315a15d860afdb2450f1
          path: upstream
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve image names and pin the official amd64 base
        id: prepare
        env:
          NC_REQUESTED_VERSION: ${{ inputs.nextcloud_version }}
        shell: bash
        run: |
          set -euo pipefail
          case "$NC_REQUESTED_VERSION" in
            32.0.15|33.0.9|34.0.4|35.0.2) ;;
            *) echo 'Unsupported Nextcloud version' >&2; exit 1 ;;
          esac
          nc_owner="${GITHUB_REPOSITORY_OWNER,,}"
          nc_image="ghcr.io/${nc_owner}/nextcloud-fpm"
          nc_base="docker.io/library/nextcloud:${NC_REQUESTED_VERSION}-fpm"
          if ! nc_index="$(docker buildx imagetools inspect --raw "$nc_base")"; then
            echo "::error::Could not resolve ${nc_base}. The exact official FPM image must be available before this build can continue."
            exit 1
          fi
          nc_digest="$(python3 -c '
          import json, sys
          index = json.load(sys.stdin)
          matches = [item["digest"] for item in index.get("manifests", [])
                     if item.get("platform", {}).get("os") == "linux"
                     and item.get("platform", {}).get("architecture") == "amd64"]
          if len(matches) != 1:
              sys.exit("Expected exactly one official linux/amd64 image")
          print(matches[0])
          ' <<< "$nc_index")"
          [[ "$nc_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo 'Could not resolve the official amd64 base digest' >&2
            exit 1
          }
          {
            echo "image=$nc_image"
            echo "version=$NC_REQUESTED_VERSION"
            echo "test_image=${nc_image}:check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "base_image=${nc_base}@${nc_digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Use the resolved official base in the pinned Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("upstream/apps/nextcloud-fpm/Dockerfile")
          text = path.read_text(encoding="utf-8")
          original = "ARG VERSION\nFROM public.ecr.aws/docker/library/nextcloud:${VERSION}\n"
          replacement = "ARG BASE_IMAGE\nFROM ${BASE_IMAGE}\n"
          if text.count(original) != 1:
              raise SystemExit("Unexpected upstream Dockerfile; review the base-image replacement")
          path.write_text(text.replace(original, replacement, 1), encoding="utf-8")
          PY

      - name: Build the image for validation
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: upstream/apps/nextcloud-fpm
          file: upstream/apps/nextcloud-fpm/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          pull: true
          provenance: false
          tags: ${{ steps.prepare.outputs.test_image }}
          build-args: |
            BASE_IMAGE=${{ steps.prepare.outputs.base_image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.prepare.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.description=Nextcloud FPM with ContainerForge configuration scripts
            io.kqmaverick.containerforge.revision=91adeaab0fa0b607112c315a15d860afdb2450f1
          cache-from: type=gha,scope=nextcloud-fpm-${{ inputs.nextcloud_version }}
          cache-to: type=gha,mode=max,scope=nextcloud-fpm-${{ inputs.nextcloud_version }}

      - name: Check architecture and patched PHP runtime
        id: runtime
        env:
          NC_TEST_IMAGE: ${{ steps.prepare.outputs.test_image }}
        shell: bash
        run: |
          set -euo pipefail
          nc_arch="$(docker image inspect --format '{{.Architecture}}' "$NC_TEST_IMAGE")"
          [[ "$nc_arch" == 'amd64' ]] || {
            echo "::error::Expected amd64; found ${nc_arch}" >&2
            exit 1
          }
          nc_php_version="$(docker run --rm --network none --entrypoint php "$NC_TEST_IMAGE" -r 'echo PHP_VERSION;')"
          if [[ ! "$nc_php_version" =~ ^8\.([2345])\.([0-9]+)$ ]]; then
            echo "::error::Unsupported or non-stable PHP runtime: ${nc_php_version}" >&2
            exit 1
          fi
          nc_php_branch="${BASH_REMATCH[1]}"
          nc_php_patch="${BASH_REMATCH[2]}"
          case "$nc_php_branch" in
            2) nc_php_min_patch=35 ;;
            3) nc_php_min_patch=36 ;;
            4) nc_php_min_patch=27 ;;
            5) nc_php_min_patch=12 ;;
          esac
          if (( 10#$nc_php_patch < nc_php_min_patch )); then
            echo "::error::PHP ${nc_php_version} lacks the required CVE-2026-109618/CVE-2026-109619 fixes. Need PHP 8.${nc_php_branch}.${nc_php_min_patch} or later in that branch." >&2
            exit 1
          fi
          echo "Verified linux/amd64 / PHP ${nc_php_version}: October 21 security fixes included."
          printf 'php_version=%s\n' "$nc_php_version" >> "$GITHUB_OUTPUT"

      - name: Check the actual server version and PHP extensions
        env:
          NC_TEST_IMAGE: ${{ steps.prepare.outputs.test_image }}
          NC_VERSION: ${{ steps.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --env "EXPECTED_NEXTCLOUD_VERSION=$NC_VERSION" \
            --entrypoint php "$NC_TEST_IMAGE" -r '
              require "/usr/src/nextcloud/version.php";
              $expected = getenv("EXPECTED_NEXTCLOUD_VERSION");
              if ($OC_VersionString !== $expected) {
                fwrite(STDERR, "Expected Nextcloud $expected; found $OC_VersionString\n");
                exit(1);
              }
              foreach (["bz2", "soap", "imap", "smbclient", "redis", "imagick", "pdo_pgsql"] as $extension) {
                if (!extension_loaded($extension)) {
                  fwrite(STDERR, "Missing PHP extension: $extension\n");
                  exit(1);
                }
              }
              echo "Nextcloud $OC_VersionString / PHP ", PHP_VERSION, "\n";
            '

      - name: Check PHP-FPM and the chart's helper scripts
        env:
          NC_TEST_IMAGE: ${{ steps.prepare.outputs.test_image }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --entrypoint php-fpm "$NC_TEST_IMAGE" -t
          docker run --rm --network none --entrypoint /bin/sh "$NC_TEST_IMAGE" -ec '
            test -x /usr/bin/occ
            test -x /healthcheck.sh
            test -x /entrypoint.sh
            test -d /configure-scripts
            grep -q "Executing injected scripts" /entrypoint.sh
            /bin/sh -n /entrypoint.sh
            /bin/bash -n /usr/bin/occ
            /bin/sh -n /healthcheck.sh
            for script in /configure-scripts/*.sh; do
              /bin/sh -n "$script"
            done
          '

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the validated image and show its digest
        id: publish
        env:
          NC_TEST_IMAGE: ${{ steps.prepare.outputs.test_image }}
          NC_IMAGE: ${{ steps.prepare.outputs.image }}
          NC_VERSION: ${{ steps.prepare.outputs.version }}
          NC_BASE_IMAGE: ${{ steps.prepare.outputs.base_image }}
          NC_PHP_VERSION: ${{ steps.runtime.outputs.php_version }}
        shell: bash
        run: |
          set -euo pipefail
          nc_tag="${NC_IMAGE}:${NC_VERSION}"
          docker tag "$NC_TEST_IMAGE" "$nc_tag"
          docker push "$nc_tag"
          nc_inspect="$(docker buildx imagetools inspect "$nc_tag")"
          nc_digest="$(awk '$1 == "Digest:" { print $2; exit }' <<< "$nc_inspect")"
          [[ "$nc_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo 'Could not resolve the published image digest' >&2
            exit 1
          }
          nc_pinned="${nc_tag}@${nc_digest}"
          echo "pinned_image=$nc_pinned" >> "$GITHUB_OUTPUT"
          printf 'Published image: %s\n' "$nc_pinned"
          {
            echo '## Published Nextcloud FPM image'
            echo
            printf '`%s`\n' "$nc_pinned"
            echo
            echo '### Catalog image block'
            echo '```yaml'
            echo 'image:'
            printf '  repository: %s\n' "$NC_IMAGE"
            echo '  pullPolicy: IfNotPresent'
            printf '  tag: %s@%s\n' "$NC_VERSION" "$nc_digest"
            echo '```'
            echo
            printf 'Upstream base: `%s`\n' "$NC_BASE_IMAGE"
            printf 'Verified PHP runtime: `%s`\n' "$NC_PHP_VERSION"
            echo
            echo 'Checks passed: amd64 architecture, patched PHP runtime, server version, required PHP extensions, PHP-FPM configuration, and helper script syntax.'
            echo
            echo 'For the first publication, set the GHCR package visibility to Public so TrueNAS can pull it without registry credentials.'
            echo 'Create a fresh backup before applying this image through the catalog update.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate the complete 35.0.2 catalog update
        if: inputs.nextcloud_version == '35.0.2'
        env:
          NC_PUBLISHED_IMAGE: ${{ steps.publish.outputs.pinned_image }}
        shell: bash
        run: |
          set -euo pipefail
          nc_catalog_commit="$(git -C catalog-source rev-parse HEAD)"
          python3 workflow-source/.github/scripts/prepare-nextcloud-catalog.py \
            --catalog-root catalog-source \
            --output-dir catalog-update \
            --image "$NC_PUBLISHED_IMAGE" \
            --source-commit "$nc_catalog_commit"
          {
            echo
            echo '## Ready-to-apply catalog update'
            echo
            echo 'Download the artifact named nextcloud-35.0.2-catalog-31.0.26 from this run.'
            echo 'It contains the complete new chart, catalog.json, app_versions.json, and a PowerShell application helper.'
            echo 'The helper checks source and payload hashes before copying files to your local catalog repo.'
            printf 'Catalog baseline: `%s`\n' "$nc_catalog_commit"
            echo 'Review and merge your catalog PR, take a fresh verified backup, then update through TrueNAS.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the generated catalog files
        if: inputs.nextcloud_version == '35.0.2'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nextcloud-35.0.2-catalog-31.0.26
          path: catalog-update/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
